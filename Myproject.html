<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            --main-background-color: #ffffff;
            color: rgb(255, 255, 255);
            --main-color:aqua
            transition: background-color 0.3s ease;
        }
        body.dark-mode {
            background-color: #121212;
        }
        .card {
            --main-width: 100%;       /* Займе всю доступну ширину */
            --main-max-width: 500px;  /* Але ніколи не стане ширшою за 500px */
        }
        .btn {
            background-color: #4f4b54; /* Сірий фон, як на твоєму скріні */
            color: #ffffff;            /* Білий текст */
            border: none;              /* Обов'язково! Прибирає стандартну 3D-рамку браузера */
            border-radius: 20px;       /* Плавне заокруглення */
            padding: 10px 24px;        /* Внутрішні відступи, щоб кнопка була об'ємною */
            font-size: 16px;
            font-family: Arial, sans-serif;
            cursor: pointer;           /* Курсор-рука при наведенні */
            transition: 0.2s;          /* Плавна анімація при наведенні */
        }

    /* Ефект, коли наводиш мишкою */
    .btn:hover {
       background-color: #65606b;
    }

    /* Ефект при натисканні */
    .btn:active {
        transform: scale(0.95);
    }
    </style>

</head>
<body>
    <h1 style="color: red; font-size: 24px; position: relative; left: 350px;;">Червоний заголовок</h1>
    <h2 style="color: aqua; font-size: px; position: relative; top: 100px;">Hello, this color created by maincolor</h2>
</body>
<button class="btn">Black/White theme</button>

<script>
    const btn = document.querySelector('.btn'); // Знаходимо нашу кнопку

    btn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode'); // Вмикаємо або вимикаємо темний фон
    });
</script>
</html>
